[package]
name = "opencursor-desktop"
version = "0.1.0"
edition = "2021"
description = "opencursor desktop shell — Tauri host for the local agent server"

[lib]
name = "opencursor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
